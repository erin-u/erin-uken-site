<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Erin Uken — a refreshed website is on the way. Strategy, communication, and transformation." />
  <title>Erin Uken — Coming Soon</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://erinuken.com/" />
  <meta name="author" content="Erin Uken" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Erin Uken — Coming Soon" />
  <meta property="og:description" content="A refreshed website is on the way." />
  <meta property="og:url" content="https://erinuken.com/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Honest, minimal structured data so search engines and AI read the basics correctly. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "https://erinuken.com/#erin",
    "name": "Erin Uken",
    "url": "https://erinuken.com/",
    "description": "Erin Uken works across AI business consulting, real estate, and peer-to-peer coaching, with more than 20 years of experience spanning diverse industries. Her family's Colorado River roots in Arizona go back to the 1960s."
  }
  </script>
  <style>
    :root{
      --teal:#08b4b7; --teal-deep:#068f92; --teal-ink:#06565a;
      --magenta:#e83e8c;
      --ink:#14181b; --muted:#56636c;
      --bg:#eef1f2; --gray:#f5f7f8;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--ink);
      font-family:"Montserrat","Segoe UI",system-ui,sans-serif;
      background:
        radial-gradient(900px 540px at 50% -8%, rgba(8,180,183,.12) 0%, rgba(8,180,183,0) 60%),
        linear-gradient(180deg, var(--gray) 0%, var(--bg) 100%);
      display:flex; flex-direction:column; min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.25rem; }
    .card{ width:100%; max-width:600px; text-align:center }
    .eyebrow{
      letter-spacing:.3em; text-transform:uppercase;
      font-size:.74rem; font-weight:700; color:var(--teal-deep);
      margin:0 0 1.5rem;
    }
    h1{
      font-weight:800; letter-spacing:-.01em;
      font-size:clamp(2.1rem,6.4vw,3.2rem); line-height:1.08;
      color:var(--ink); margin:0 0 1.1rem;
    }
    .rule{
      width:64px; height:3px; border:0; border-radius:3px; margin:0 auto 1.6rem;
      background:linear-gradient(90deg, var(--teal) 0 60%, var(--magenta) 60% 100%);
    }
    .tagline{
      font-weight:500; letter-spacing:.14em; text-transform:uppercase;
      font-size:clamp(.74rem,2.3vw,.9rem); color:var(--muted);
      margin:0 0 1.7rem;
    }
    .note{ color:var(--muted); font-size:1.02rem; line-height:1.6; margin:0 auto; max-width:30rem }
    .note b{ color:var(--teal-ink); font-weight:600 }
    footer{
      text-align:center; padding:1.5rem 1.25rem;
      color:rgba(86,99,108,.7); font-size:.78rem; font-weight:500;
      letter-spacing:.02em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <p class="eyebrow">Erin Uken</p>
      <h1>Something thoughtful is&nbsp;on&nbsp;the&nbsp;way.</h1>
      <hr class="rule" />
      <p class="tagline">Strategy · Communication · Transformation</p>
      <p class="note">My website is being refreshed. Thank you for visiting while it&rsquo;s <b>under construction</b> — please check back soon.</p>
    </div>
  </main>
  <footer>&copy; <span id="y"></span> Erin Uken</footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
